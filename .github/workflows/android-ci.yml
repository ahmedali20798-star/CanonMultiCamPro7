name: Verify & Build CanonMultiCam Pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Detekt Strict Static Analysis
        run: gradle detekt --no-daemon --stacktrace

      - name: Run Deterministic Protocol & Temporal Proof Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Assemble Verified Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Verified APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanonMultiCamPro-V14-Verified-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
